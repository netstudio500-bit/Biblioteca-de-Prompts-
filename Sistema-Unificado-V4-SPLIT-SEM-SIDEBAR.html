  ============================================================================
  ARQUIVO LEGADO — NÃO É O ENTRY POINT DO APLICATIVO.

  Esta é uma versão standalone antiga (React via CDN esm.sh), mantida apenas
  como referência histórica. NÃO é empacotada pelo electron-builder.

  O BOT.IA é construído a partir de `src/main.jsx`:
    - entry web              -> index.html  ->  /src/main.jsx (Vite)
    - janela Electron        -> electron/main.cjs -> dist/index.html
  NÃO edite este HTML esperando alterar o aplicativo. Edite `src/main.jsx`.
  ============================================================================
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOT.IA - Sistema Unificado V4 Split</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{font-family:'Inter',sans-serif;box-sizing:border-box}
    .font-mono{font-family:'JetBrains Mono',monospace!important}
    html,body,#root{width:100%;height:100%;min-height:100%;overflow:hidden}
    body{background:#121212;color:#EDEDED}
    .custom-scrollbar::-webkit-scrollbar{width:4px;height:4px}
    .custom-scrollbar::-webkit-scrollbar-thumb{background:#1E1E20;border-radius:10px}
    input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:#2A2A2A;border-radius:4px;outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:white;cursor:pointer;border:2px solid #121212;box-shadow:0 0 0 1px rgba(255,255,255,0.15)}
    /* Split layout */
    .app-root{display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden;background:#121212}
    .app-header{height:56px;min-height:56px;flex-shrink:0;border-bottom:1px solid rgba(30,30,32,0.6);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#1A1A1A;gap:12px}
    @media(min-width:1024px){.app-header{height:60px;min-height:60px;padding:0 24px}}
    .split-container{display:flex;flex:1;min-height:0;overflow:hidden;width:100%;position:relative}
    .chat-panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:#1A1A1A;overflow:hidden}
    .chat-scroll{flex:1;overflow-y:auto;background:#181818;display:flex;flex-direction:column;min-height:0}
    .preview-panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:#151515;overflow:hidden}
    .preview-scroll{flex:1;overflow-y:auto;min-height:0}
    .divider{flex-shrink:0;background:rgba(30,30,32,0.6);position:relative;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;z-index:2}
    .divider::after{content:'';background:rgba(255,255,255,0.08);position:absolute}
    .divider-horizontal{width:8px;cursor:col-resize}
    .divider-horizontal::after{width:1px;height:100%;left:50%;top:0;transform:translateX(-50%)}
    .divider-horizontal:hover,.divider-horizontal.dragging{background:rgba(255,255,255,0.06)}
    .divider-horizontal:hover::after,.divider-horizontal.dragging::after{background:rgba(255,255,255,0.18);width:3px}
    .divider-vertical{height:8px;cursor:row-resize;width:100%}
    .divider-vertical::after{height:1px;width:100%;top:50%;left:0;transform:translateY(-50%)}
    .divider-vertical:hover,.divider-vertical.dragging{background:rgba(255,255,255,0.06)}
    .divider-vertical:hover::after,.divider-vertical.dragging::after{background:rgba(255,255,255,0.18);height:3px}
    .divider:focus{outline:2px solid white;outline-offset:-2px}
    .divider:focus-visible{outline:2px solid white}
    @media(max-width:768px){
      .split-container{flex-direction:column}
      .chat-panel{width:100%!important}
      .preview-panel{width:100%!important;border-left:none!important;border-top:1px solid rgba(30,30,32,0.6)}
    }
    /* Mobile stacking order is natural */
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2A2A2A;border:1px solid rgba(255,255,255,0.1);padding:10px 16px;border-radius:999px;font-family:'JetBrains Mono';font-size:11px;color:white;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18.3.1';
    import ReactDOM from 'https://esm.sh/react-dom@18.3.1/client';

    const {useState,useEffect,useRef,useCallback} = React;

    const defaultSkills = [
      {id:"rag",icon:"📚",name:"RAG Local",desc:"Busca em documentos e memórias salvas antes de responder",prompt:"Você tem acesso a memórias e documentos do usuário. Sempre consulte o contexto de memória antes de responder e cite fontes quando relevante.",enabled:true},
      {id:"csv",icon:"📊",name:"Analisador CSV",desc:"Interpreta planilhas e dados tabulares automaticamente",prompt:"Quando o usuário enviar CSV/tabela, identifique colunas, tipos, outliers e gere insights em formato estruturado. Use markdown table para resumir.",enabled:true},
      {id:"gen",icon:"🤖",name:"Gerador de Agente",desc:"Cria sub-agentes especializados sob demanda",prompt:"Você pode sugerir a criação de um novo agente especializado quando detectar tarefa repetitiva. Formate como: [AGENT: nome | objetivo | prompt].",enabled:false},
      {id:"sql",icon:"🗄️",name:"SQL Tool",desc:"Gera e otimiza queries SQL a partir de linguagem natural",prompt:"Traduza pedidos em SQL ANSI otimizado. Sempre explique a query, use CTEs quando complexo e alerte sobre riscos de DELETE/UPDATE sem WHERE.",enabled:false},
    ];

    const defaultAgent = {name:"BOT.IA Financeiro",systemPrompt:"Você é o BOT.IA, assistente financeiro especialista em fluxo de caixa, DRE e análises gerenciais. Seja direto, use markdown, foque em ação. Sempre considere memórias pinadas do usuário.",temperature:0.7,topP:0.9,maxTokens:2048};

    function App(){
      // Routing
      const readRoute = () => {
        const h = window.location.hash.replace(/^#/,'');
        if(h==="config"||h==="config/") return "config/memoria";
        if(["config/memoria","config/skills","config/agente"].includes(h)) return h;
        return "chat";
      };
      const [routeVersion,setRouteVersion] = useState(0);
      const currentRoute = readRoute();
      const isChat = currentRoute==="chat";
      const activeTab = currentRoute.startsWith("config/")? currentRoute.split("/")[1] : "memoria";
      const navigate = (r) => {
        const target = r==="chat"?"#chat":`#${r}`;
        if(window.location.hash===target) setRouteVersion(v=>v+1);
        else window.location.hash=target;
      };
      useEffect(()=>{
        const sync=()=>{
          const h=window.location.hash;
          if(h==="#config"||h==="#config/"){window.location.hash="#config/memoria";return}
          setRouteVersion(v=>v+1);
        };
        sync();
        window.addEventListener('hashchange',sync);
        return ()=>window.removeEventListener('hashchange',sync);
      },[]);

      // Core states
      const [time,setTime] = useState("00:00:00");
      const [input,setInput] = useState("");
      const [messages,setMessages] = useState([
        {id:"m1",from:"system",text:"BOT.IA • Sistema unificado v3 • Memória + Skills + Agente configurável • Split 50/50 sem sidebar",time:"10:30"},
        {id:"m2",from:"them",text:"Memória ativa! Suas notas pinadas e skills serão injetadas automaticamente no agente. Layout agora em split horizontal com divisor arrastável.",time:"10:31"}
      ]);
      const [activeModel,setActiveModel] = useState(null);
      const [ollamaOnline,setOllamaOnline] = useState(null);
      const [baseUrl,setBaseUrl] = useState("http://localhost:11434");
      const [models,setModels] = useState([]);
      const [running,setRunning] = useState([]);
      const [isStreaming,setIsStreaming] = useState(false);
      const abortRef = useRef(null);
      const bottomRef = useRef(null);
      const [toast,setToast] = useState(null);
      const [previewTab,setPreviewTab] = useState("Render");
      const [memories,setMemories] = useState([]);
      const [memTitle,setMemTitle] = useState("");
      const [memContent,setMemContent] = useState("");
      const [skills,setSkills] = useState(defaultSkills);
      const [showNewSkill,setShowNewSkill] = useState(false);
      const [newSkill,setNewSkill] = useState({icon:"✨",name:"",desc:"",prompt:"",enabled:true});
      const [agent,setAgent] = useState(defaultAgent);
      const [attached,setAttached] = useState([]);
      const fileInputRef = useRef(null);

      // Split states - REQUIREMENTS
      const [splitPct,setSplitPct] = useState(50); // 50/50 initial
      const [isDragging,setIsDragging] = useState(false);
      const [isMobile,setIsMobile] = useState(window.innerWidth<=768);
      const splitContainerRef = useRef(null);

      useEffect(()=>{
        const onResize = () => setIsMobile(window.innerWidth<=768);
        window.addEventListener('resize',onResize);
        return ()=>window.removeEventListener('resize',onResize);
      },[]);

      // Drag logic mouse/touch
      const clamp = (v,min,max)=>Math.min(max,Math.max(min,v));
      const startDrag = useCallback((e)=>{
        e.preventDefault();
        setIsDragging(true);
      },[]);

      useEffect(()=>{
        if(!isDragging) return;
        const handleMove = (clientX,clientY) => {
          if(!splitContainerRef.current) return;
          const rect = splitContainerRef.current.getBoundingClientRect();
          let pct;
          if(isMobile){
            // vertical
            pct = ((clientY - rect.top) / rect.height) * 100;
          }else{
            pct = ((clientX - rect.left) / rect.width) * 100;
          }
          pct = clamp(pct,30,70);
          setSplitPct(pct);
        };
        const onMouseMove = (e)=>handleMove(e.clientX,e.clientY);
        const onTouchMove = (e)=>{
          if(e.touches[0]) handleMove(e.touches[0].clientX,e.touches[0].clientY);
        };
        const onUp = ()=>setIsDragging(false);
        window.addEventListener('mousemove',onMouseMove);
        window.addEventListener('mouseup',onUp);
        window.addEventListener('touchmove',onTouchMove,{passive:false});
        window.addEventListener('touchend',onUp);
        document.body.style.cursor = isMobile ? 'row-resize' : 'col-resize';
        document.body.style.userSelect='none';
        return ()=>{
          window.removeEventListener('mousemove',onMouseMove);
          window.removeEventListener('mouseup',onUp);
          window.removeEventListener('touchmove',onTouchMove);
          window.removeEventListener('touchend',onUp);
          document.body.style.cursor='';
          document.body.style.userSelect='';
        };
      },[isDragging,isMobile]);

      const onDividerKeyDown = (e)=>{
        let delta=0;
        if(!isMobile){
          if(e.key==='ArrowLeft') delta=-1;
          if(e.key==='ArrowRight') delta=1;
        }else{
          if(e.key==='ArrowUp') delta=-1;
          if(e.key==='ArrowDown') delta=1;
        }
        if(e.key==='Home'){setSplitPct(30);e.preventDefault();return}
        if(e.key==='End'){setSplitPct(70);e.preventDefault();return}
        if(delta!==0){
          e.preventDefault();
          setSplitPct(p=>clamp(p+delta,30,70));
        }
        if(e.key==='PageDown'){setSplitPct(p=>clamp(p+5,30,70));e.preventDefault();}
        if(e.key==='PageUp'){setSplitPct(p=>clamp(p-5,30,70));e.preventDefault();}
      };

      // Load from localStorage
      useEffect(()=>{
        try{const d=localStorage.getItem('botia_memories');if(d)setMemories(JSON.parse(d))}catch{}
        try{const d=localStorage.getItem('botia_skills');if(d){const k=JSON.parse(d);if(Array.isArray(k)&&k.length)setSkills(k)}}catch{}
        try{const d=localStorage.getItem('botia_agent');if(d)setAgent(JSON.parse(d))}catch{}
      },[]);
      useEffect(()=>{try{localStorage.setItem('botia_memories',JSON.stringify(memories))}catch{}},[memories]);
      useEffect(()=>{try{localStorage.setItem('botia_skills',JSON.stringify(skills))}catch{}},[skills]);
      useEffect(()=>{try{localStorage.setItem('botia_agent',JSON.stringify(agent))}catch{}},[agent]);
      useEffect(()=>{const tick=()=>setTime(new Date().toLocaleTimeString('pt-BR',{hour12:false}));tick();const id=setInterval(tick,1000);return()=>clearInterval(id)},[]);
      useEffect(()=>{if(!toast)return;const id=setTimeout(()=>setToast(null),3500);return()=>clearTimeout(id)},[toast]);
      useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'})},[messages]);

      // Ollama scan
      useEffect(()=>{
        let alive=true;
        if(typeof window!=='undefined' && window.location.protocol==='file:'){setOllamaOnline(false);return}
        const endpoints=["http://localhost:11434","http://127.0.0.1:11434","/ollama",""];
        const scan=async()=>{
          for(let ep of endpoints){
            const tagsUrl = ep ? `${ep.replace(/\/$/,'')}/api/tags` : '/api/tags';
            const psUrl = ep ? `${ep.replace(/\/$/,'')}/api/ps` : '/api/ps';
            try{
              const ctrl=new AbortController();
              const t=setTimeout(()=>ctrl.abort(),2200);
              const res=await fetch(tagsUrl,{signal:ctrl.signal});
              clearTimeout(t);
              if(!res.ok) continue;
              const data=await res.json();
              if(!data?.models) continue;
              if(!alive) return;
              setOllamaOnline(true);
              setBaseUrl(ep||"http://localhost:11434");
              setModels(data.models);
              try{
                const r2=await fetch(psUrl);
                if(r2.ok){const d2=await r2.json();if(d2?.models?.length){setRunning(d2.models);if(!activeModel) setActiveModel(d2.models[0].name||d2.models[0].model)}}
              }catch{}
              const gem=data.models.find(m=>m.name.includes('gemma'));
              if(gem && !activeModel && running.length===0) setActiveModel(prev=>prev||gem.name);
              return;
            }catch{continue}
          }
          if(alive){setOllamaOnline(false);setRunning([])}
        };
        scan();
        const id=setInterval(scan,5000);
        return ()=>{alive=false;clearInterval(id)}
      },[activeModel]);

      const formatSize = (b)=>{if(b<1024)return `${b}B`;if(b<1048576)return `${(b/1024).toFixed(1)}KB`;return `${(b/1048576).toFixed(1)}MB`};
      const formatModelSize = (b)=>{if(!b)return '0B';const gb=b/1073741824;if(gb>=1)return `${gb.toFixed(1)}GB`;return `${(b/1048576).toFixed(0)}MB`};

      const handleFiles = (e)=>{
        const files=e.target.files;
        if(!files||files.length===0) return;
        const arr=Array.from(files).map(f=>({name:f.name,size:formatSize(f.size)}));
        setAttached(prev=>[...prev,...arr].slice(0,5));
        setToast(`${arr.length} arquivo(s) anexado(s)`);
        if(fileInputRef.current) fileInputRef.current.value='';
      };

      const clearChat = ()=>{
        setMessages([{id:`sys-${Date.now()}`,from:"system",text:`Conversas limpas • Agente: ${agent.name} • ${memories.length} memórias • ${skills.filter(s=>s.enabled).length} skills`,time:new Date().toLocaleTimeString('pt-BR',{hour:"2-digit",minute:"2-digit"}) }]);
        setToast("Conversas limpas");
      };

      const buildContext = ()=>{
        const pinned=memories.filter(m=>m.pinned);
        const recent=memories.filter(m=>!m.pinned).slice(0,5);
        const used=pinned.length?pinned:recent;
        const activeSkills=skills.filter(s=>s.enabled);
        let sys=agent.systemPrompt.trim();
        if(used.length){sys+=`\n\n[MEMÓRIAS DO USUÁRIO]\n`+used.map(m=>`• ${m.title}: ${m.content}`).join("\n"); if(pinned.length) sys+=`\n(Nota: memórias pinadas são prioritárias)`}
        if(activeSkills.length) sys+=`\n\n[SKILLS ATIVAS]\n`+activeSkills.map(s=>`• ${s.name} (${s.icon}): ${s.prompt}`).join("\n");
        sys+=`\n\n[CONFIG AGENTE] Nome=${agent.name} | Temp=${agent.temperature} | TopP=${agent.topP} | MaxTokens=${agent.maxTokens}`;
        return {system:sys,memoriesUsed:used,skillsUsed:activeSkills,options:{temperature:agent.temperature,top_p:agent.topP,num_predict:agent.maxTokens}}
      };
      const ctx = buildContext();

      const sendMessage = async()=>{
        const hasText=input.trim().length>0;
        const hasFiles=attached.length>0;
        if(!hasText && !hasFiles) return;
        if(isStreaming) return;
        const filesSuffix = hasFiles?` [${attached.map(f=>f.name).join(", ")}]`:"";
        const textToSend = hasText?`${input}${filesSuffix}`:`Arquivos: ${filesSuffix}`;
        const originalInput=input;
        const filesCopy=[...attached];
        const newMsg={id:Date.now().toString(),from:"me",text:textToSend,files:hasFiles?[...attached]:undefined,time:new Date().toLocaleTimeString('pt-BR',{hour:"2-digit",minute:"2-digit"})};
        setMessages(prev=>[...prev,newMsg]);
        setInput("");
        setAttached([]);
        const context=buildContext();
        if(ollamaOnline && activeModel){
          const id=(Date.now()+1).toString();
          const apiUrl = baseUrl?`${baseUrl.replace(/\/$/,'')}/api/chat`:'/api/chat';
          setMessages(prev=>[...prev,{id,from:"them",model:`${activeModel} • ${agent.name}`,text:"",streaming:true,time:new Date().toLocaleTimeString('pt-BR',{hour:"2-digit",minute:"2-digit"}),context}]);
          setIsStreaming(true);
          abortRef.current=new AbortController();
          try{
            const history=messages.filter(m=>m.from==="me"||m.from==="them").slice(-10).map(m=>({role:m.from==="me"?"user":"assistant",content:m.text}));
            const payload={model:activeModel,messages:[{role:"system",content:context.system},...history,{role:"user",content:originalInput}],stream:true,options:context.options};
            const res=await fetch(apiUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:abortRef.current.signal});
            if(!res.ok||!res.body) throw Error(`HTTP ${res.status}`);
            const reader=res.body.getReader();
            const decoder=new TextDecoder();
            let buffer="",full="";
            while(true){
              const {done,value}=await reader.read();
              if(done) break;
              buffer+=decoder.decode(value,{stream:true});
              const lines=buffer.split("\n");
              buffer=lines.pop()||"";
              for(const line of lines){
                if(!line.trim()) continue;
                try{
                  const json=JSON.parse(line);
                  if(json.message?.content){full+=json.message.content;setMessages(prev=>prev.map(m=>m.id===id?{...m,text:full}:m))}
                }catch{}
              }
            }
            setMessages(prev=>prev.map(m=>m.id===id?{...m,streaming:false,text:full||"[sem resposta]"}:m));
          }catch(err){
            if(err.name==="AbortError"){
              setMessages(prev=>prev.map(m=>m.id===id?{...m,streaming:false,text:m.text+"\n[interrompido]"}:m));
            }else{
              setMessages(prev=>prev.filter(m=>m.id!==id).concat([{id:(Date.now()+2).toString(),from:"them",model:activeModel,text:`Erro ${apiUrl}: ${err.message}`,time:new Date().toLocaleTimeString('pt-BR',{hour:"2-digit",minute:"2-digit"})}]));
            }
          }finally{setIsStreaming(false);abortRef.current=null}
          return;
        }
        setTimeout(()=>{
          const c=buildContext();
          setMessages(prev=>[...prev,{id:(Date.now()+1).toString(),from:"them",model:agent.name,text:`(${agent.name}) Contexto montado: ${c.memoriesUsed.length} memórias + ${c.skillsUsed.length} skills\n\nSystem: ${c.system.slice(0,180)}...\n\nVocê disse: "${originalInput.slice(0,120)}${filesCopy.length?` + ${filesCopy.length} arq`:""}"`,time:new Date().toLocaleTimeString('pt-BR',{hour:"2-digit",minute:"2-digit"}),context:c}]);
        },300);
      };

      const activateModel = (name)=>{setActiveModel(name);setToast(`${name} ativado`)};
      const stopModel = (name)=>{
        const target=name||activeModel;
        if(!target) return;
        setActiveModel(null);
        setRunning(prev=>prev.filter(m=>m.name!==target && m.model!==target));
        setToast(`Modelo parado • ${target}`);
      };

      // Memories
      const saveMemory = ()=>{
        if(!memTitle.trim()||!memContent.trim()){setToast("Preencha título e conteúdo");return}
        const m={id:Date.now().toString(),title:memTitle.trim(),content:memContent.trim(),pinned:false,createdAt:new Date().toISOString()};
        setMemories(prev=>[m,...prev]);
        setMemTitle("");setMemContent("");setToast(`Memória salva • "${m.title}"`);
      };
      const togglePin = (id)=>setMemories(prev=>prev.map(m=>m.id===id?{...m,pinned:!m.pinned}:m));
      const deleteMemory = (id)=>setMemories(prev=>prev.filter(m=>m.id!==id));
      const toggleSkill = (id)=>setSkills(prev=>prev.map(s=>s.id===id?{...s,enabled:!s.enabled}:s));
      const createSkill = ()=>{
        if(!newSkill.name.trim()||!newSkill.prompt.trim()){setToast("Nome e prompt obrigatórios");return}
        const s={...newSkill,id:`skill_${Date.now()}`,name:newSkill.name.trim(),desc:newSkill.desc.trim()||"Skill personalizada",prompt:newSkill.prompt.trim()};
        setSkills(prev=>[s,...prev]);
        setNewSkill({icon:"✨",name:"",desc:"",prompt:"",enabled:true});
        setShowNewSkill(false);
        setToast(`Skill criada • ${s.name}`);
      };
      const deleteSkill = (id)=>{
        if(defaultSkills.some(s=>s.id===id)){setToast("Skill padrão não pode ser removida, apenas desativada");return}
        setSkills(prev=>prev.filter(s=>s.id!==id));
      };

      const pinnedCount=memories.filter(m=>m.pinned).length;
      const activeSkillsCount=skills.filter(s=>s.enabled).length;

      return React.createElement("div",{className:"app-root"},
        // Header - no sidebar, only header with config button ⚙
        React.createElement("header",{className:"app-header"},
          React.createElement("div",{className:"flex items-center gap-3 min-w-0"},
            React.createElement("div",{className:"w-8 h-8 rounded-[10px] bg-white text-black flex items-center justify-center font-bold text-[12px] shrink-0"},"B"),
            React.createElement("div",{className:"leading-none min-w-0"},
              React.createElement("p",{className:"font-semibold text-[13px] tracking-[-0.02em] text-white leading-none"},"BOT.IA"),
              React.createElement("p",{className:"font-mono text-[9px] text-[#6A6A6A] mt-0.5 truncate"}, agent.name.split(" ").slice(0,2).join(" "))
            ),
            React.createElement("div",{className:"hidden md:flex items-center gap-1.5 font-mono text-[11px] ml-4 min-w-0"},
              React.createElement("span",{className:"text-[#8A8A8A]"},"Sistema"),
              React.createElement("span",{className:"text-[#5A5A5A]"},"›"),
              React.createElement("span",{className:"text-white truncate"}, isChat? "Chat" : `Config / ${activeTab}`)
            ),
            isChat && activeModel && React.createElement("span",{className:"hidden lg:flex items-center gap-1.5 ml-2 font-mono text-[10px] px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 truncate"},
              React.createElement("span",{className:"w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"}),
              `${activeModel} • ${agent.name}`
